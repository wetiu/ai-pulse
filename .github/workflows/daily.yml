name: Update AI Pulse

on:
  schedule:
    # Runs daily at 05:17 UTC (12:17 Asia/Saigon). Change if you like.
    - cron: "17 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# Allow the job to commit refreshed data and deploy to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        run: node build.mjs

      # A daily commit is what keeps GitHub from disabling the schedule
      # after 60 days of repository inactivity.
      - name: Commit refreshed data (keeps the schedule alive)
        run: |
          git config user.name "ai-pulse-bot"
          git config user.email "ai-pulse-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "chore: refresh AI Pulse $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
